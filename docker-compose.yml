services:
  gigaam-bot:
    build: .
    container_name: gigaam-bot
    restart: unless-stopped
    mem_limit: 2.5g
    memswap_limit: 4g
    env_file: .env
    environment:
      - AUDIO_PREPROCESSING_MODE=off
      - LOG_LEVEL=WARNING
      - TELETHON_SESSION=/data/telethon_bot
      # Для анализа всей записи одним проходом включите строку ниже: 0 отключает нарезку на части.
      # Внимание: полный файл может потребовать существенно больше памяти и вызвать OOM.
      - CHUNK_SECONDS=0
      - MALLOC_ARENA_MAX=2
    volumes:
      - hf_cache:/app/.hf_cache
      - tg-session:/data
    networks:
      - gigaam

volumes:
  hf_cache:
  tg-session:

networks:
  gigaam:
    driver: bridge